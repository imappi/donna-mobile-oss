name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 22 ships npm 10.9; the lockfile installs on npm 10 and 11 alike.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Unit and mock-server tests only. `npm run test:cleanup:live` calls a
      # real model and must never run here.
      - run: npm test
      - name: Build smoke (web export)
        run: npx expo export --platform web
